[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elementgate"
version = "0.1.0"
description = "Deterministic chemistry validator: parse formulas, compute molar mass, and check that reactions conserve atoms and charge."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kyal" }]
keywords = ["chemistry", "molar-mass", "stoichiometry", "reaction-balancing", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kyal102/elementgate"
Issues = "https://github.com/kyal102/elementgate/issues"

[project.scripts]
elementgate = "elementgate.__main__:main"

[tool.setuptools]
packages = ["elementgate"]
